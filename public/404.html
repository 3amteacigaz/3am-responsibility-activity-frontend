<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3AM Core - Redirecting...</title>
    <script type="text/javascript">
      // Simple and reliable GitHub Pages SPA redirect
      var l = window.location;
      
      // For URL: https://3amteacigaz.github.io/3am-responsibility-activity-frontend/dashboard
      // We want to redirect to: https://3amteacigaz.github.io/3am-responsibility-activity-frontend/?/dashboard
      
      var repoName = '3am-responsibility-activity-frontend';
      var fullPath = l.pathname;
      
      // Find where the repo name ends and the route begins
      var repoPath = '/' + repoName + '/';
      var routeStart = fullPath.indexOf(repoPath);
      
      if (routeStart !== -1) {
        // Extract the route part (everything after /repo-name/)
        var route = fullPath.substring(routeStart + repoPath.length);
        
        // Build redirect URL
        var redirectUrl = l.protocol + '//' + l.hostname + repoPath + '?/' + route + l.search + l.hash;
        
        console.log('404 Redirect:', fullPath, '→', redirectUrl);
        l.replace(redirectUrl);
      } else {
        // Fallback: redirect to home
        console.log('404 Fallback redirect to home');
        l.replace(l.protocol + '//' + l.hostname + '/' + repoName + '/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
