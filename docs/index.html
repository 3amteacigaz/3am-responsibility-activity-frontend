<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/3am-responsibility-activity-frontend/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3AM Core</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      console.log('index.html - App loading');
      console.log('index.html - Current URL:', window.location.href);
      console.log('index.html - Hash:', window.location.hash);
      console.log('index.html - Pathname:', window.location.pathname);
      
      // Check if we have a hash route
      if (window.location.hash && window.location.hash.startsWith('#/')) {
        console.log('index.html - Hash route detected, React Router will handle it');
      } else {
        // Check if we're on a direct route that should be converted to hash
        var pathname = window.location.pathname;
        var route = pathname.replace('/3am-responsibility-activity-frontend', '');
        
        if (route && route !== '/' && route !== '') {
          console.log('index.html - Converting direct route to hash:', route);
          // Convert direct route to hash route
          var newUrl = window.location.origin + '/3am-responsibility-activity-frontend/#' + route + window.location.search;
          console.log('index.html - Redirecting to:', newUrl);
          window.location.replace(newUrl);
        }
      }
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
