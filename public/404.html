<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3AM Core - Redirecting...</title>
    <script type="text/javascript">
      // Simple GitHub Pages SPA redirect for 3am-responsibility-activity-frontend
      var l = window.location;
      
      // Debug: Log the current URL
      console.log('404.html - Current URL:', l.href);
      console.log('404.html - Pathname:', l.pathname);
      
      // Extract the route part after the repo name
      // URL structure: https://3amteacigaz.github.io/3am-responsibility-activity-frontend/ROUTE
      var pathParts = l.pathname.split('/');
      console.log('404.html - Path parts:', pathParts);
      
      // pathParts[0] = '' (empty)
      // pathParts[1] = '3am-responsibility-activity-frontend' (repo name)
      // pathParts[2+] = the actual route (dashboard, community, etc.)
      
      var repoName = '3am-responsibility-activity-frontend';
      var route = '';
      
      // Find the repo name in the path and get everything after it
      var repoIndex = pathParts.indexOf(repoName);
      if (repoIndex !== -1 && pathParts.length > repoIndex + 1) {
        route = pathParts.slice(repoIndex + 1).join('/');
      }
      
      console.log('404.html - Extracted route:', route);
      
      // Build the redirect URL
      var redirectUrl = l.protocol + '//' + l.hostname + 
        '/' + repoName + '/?/' + route +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      
      console.log('404.html - Redirecting to:', redirectUrl);
      
      // Redirect
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to app...</p>
    <p>If you see this page, check the browser console for debug info.</p>
  </body>
</html>
