<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3AM Core</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      // Automatically detects the correct base path for GitHub Pages project sites
      
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(function(segment) {
        return segment.length > 0;
      });
      
      // For GitHub Pages project sites (username.github.io/repo-name)
      // we need to preserve the first segment (repo-name)
      var basePath = '';
      var routePath = '';
      
      if (pathSegments.length > 0) {
        // First segment is likely the repo name
        basePath = '/' + pathSegments[0];
        // Everything after the first segment is the route
        routePath = pathSegments.slice(1).join('/');
      }
      
      // Redirect to index.html with encoded route
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' + routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
